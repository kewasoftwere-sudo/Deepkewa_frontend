<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DeepKewa Labs</title>
    
    <!-- SEO & Favicon -->
    <meta name="robots" content="noindex, nofollow">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0b10',
                        cardBg: '#12141c',
                        accentBlue: '#00f2fe'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts & Lucide Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0a0b10; color: #f3f4f6; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glow { text-shadow: 0 0 15px rgba(0, 242, 254, 0.3); }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen">

    <!-- ADMIN NAVBAR -->
    <header class="bg-cardBg/80 backdrop-blur-md border-b border-gray-800 sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="shield" class="w-5 h-5 text-darkBg"></i>
                </div>
                <div>
                    <span class="font-bold text-lg text-white">DeepKewa <span class="text-xs code-font text-cyan-400">ADMIN LAB</span></span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="backendStatus" class="text-xs code-font px-3 py-1 rounded-full bg-yellow-500/10 text-yellow-400 border border-yellow-500/20">
                    Checking Server...
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-10 space-y-10">
        
        <!-- TOP STATS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="p-6 rounded-2xl bg-cardBg border border-gray-800">
                <span class="text-xs code-font text-gray-400 uppercase tracking-wider">Founder / Owner</span>
                <h3 class="text-2xl font-extrabold text-white mt-2 flex items-center space-x-2">
                    <i data-lucide="user-check" class="w-5 h-5 text-cyan-400"></i>
                    <span>Deepak</span>
                </h3>
            </div>
            <div class="p-6 rounded-2xl bg-cardBg border border-gray-800">
                <span class="text-xs code-font text-gray-400 uppercase tracking-wider">Tagline</span>
                <h3 class="text-xs font-bold text-gray-300 mt-3 code-font">WE BUILD • YOU GROW • TOGETHER</h3>
            </div>
            <div class="p-6 rounded-2xl bg-cardBg border border-gray-800">
                <span class="text-xs code-font text-gray-400 uppercase tracking-wider">Total Active Projects</span>
                <h3 class="text-3xl font-extrabold text-cyan-400 mt-2 glow" id="statCount">0</h3>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- LEFT COLUMN: OWNER PROFILE & PROJECT UPLOAD FORMS -->
            <div class="space-y-8">
                
                <!-- OWNER PROFILE & PHOTO CONFIG -->
                <div class="p-6 rounded-2xl bg-cardBg border border-gray-800 shadow-xl">
                    <h2 class="text-lg font-bold mb-4 text-white flex items-center space-x-2">
                        <i data-lucide="user" class="w-5 h-5 text-cyan-400"></i>
                        <span>Owner Profile (Deepak)</span>
                    </h2>
                    <form id="ownerForm" class="space-y-4">
                        <div>
                            <label class="block text-xs code-font text-gray-400 uppercase mb-1">Owner Name</label>
                            <input type="text" id="ownerName" value="Deepak" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                        </div>
                        <div>
                            <label class="block text-xs code-font text-gray-400 uppercase mb-1">Owner Photo URL</label>
                            <input type="url" id="ownerPhotoUrl" placeholder="https://example.com/deepak.jpg" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition">
                            <span class="text-[10px] text-gray-500 mt-1 block">Paste direct image link of Deepak</span>
                        </div>
                        <button type="submit" class="w-full py-3 rounded-xl bg-gray-800 hover:bg-gray-700 text-white font-bold text-sm border border-gray-700 transition">
                            Update Owner Profile
                        </button>
                        <div id="ownerMsg" class="text-xs text-center hidden"></div>
                    </form>
                </div>

                <!-- PROJECT UPLOAD FORM -->
                <div class="p-6 rounded-2xl bg-cardBg border border-gray-800 shadow-xl">
                    <h2 class="text-lg font-bold mb-4 text-white flex items-center space-x-2">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-cyan-400"></i>
                        <span>Upload New Project</span>
                    </h2>
                    <form id="projectForm" class="space-y-4">
                        <div>
                            <label class="block text-xs code-font text-gray-400 uppercase mb-1">Project / Product Title</label>
                            <input type="text" id="title" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="e.g. DeepKewa AI Core">
                        </div>
                        <div>
                            <label class="block text-xs code-font text-gray-400 uppercase mb-1">Category</label>
                            <input type="text" id="category" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="e.g. Enterprise Software">
                        </div>
                        <div>
                            <label class="block text-xs code-font text-gray-400 uppercase mb-1">Tech Stack</label>
                            <input type="text" id="techStack" class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="e.g. Node.js, Python, React">
                        </div>
                        <div>
                            <label class="block text-xs code-font text-gray-400 uppercase mb-1">Description / Details</label>
                            <textarea id="description" rows="3" required class="w-full bg-darkBg border border-gray-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400 transition" placeholder="Describe features, architecture, specs..."></textarea>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-darkBg font-bold text-sm hover:opacity-90 transition shadow-lg shadow-cyan-500/20">
                            Deploy / Upload Project
                        </button>
                        <div id="uploadMsg" class="text-xs text-center hidden"></div>
                    </form>
                </div>

            </div>

            <!-- RIGHT COLUMN: PROJECTS LIST -->
            <div class="lg:col-span-2 p-6 rounded-2xl bg-cardBg border border-gray-800 shadow-xl h-fit">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-lg font-bold text-white flex items-center space-x-2">
                        <i data-lucide="layers" class="w-5 h-5 text-cyan-400"></i>
                        <span>Live Uploaded Projects</span>
                    </h2>
                    <button onclick="loadAdminData()" class="text-xs code-font text-cyan-400 hover:underline flex items-center space-x-1">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
                        <span>Refresh</span>
                    </button>
                </div>
                
                <div id="adminProjectsList" class="space-y-4">
                    <!-- Dynamic Projects Load Here -->
                </div>
            </div>

        </div>
    </main>

    <script>
        // 🚨 YAHAN APNA DEPLOYED RENDER BACKEND URL DALNA
        const BACKEND_URL = "https://your-backend-name.onrender.com";

        lucide.createIcons();

        // Load data from backend
        async function loadAdminData() {
            const list = document.getElementById('adminProjectsList');
            const statusBadge = document.getElementById('backendStatus');
            
            try {
                const res = await fetch(`${BACKEND_URL}/api/projects`);
                const result = await res.json();
                
                if (result.success) {
                    statusBadge.className = "text-xs code-font px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20";
                    statusBadge.textContent = "Backend Connected";
                    
                    document.getElementById('statCount').textContent = result.data.length;
                    list.innerHTML = '';
                    
                    if (result.data.length === 0) {
                        list.innerHTML = `<p class="text-gray-500 text-sm text-center py-6">No projects uploaded yet.</p>`;
                        return;
                    }

                    result.data.forEach(p => {
                        list.innerHTML += `
                            <div class="p-4 rounded-xl bg-darkBg border border-gray-800 flex justify-between items-start gap-4 hover:border-gray-700 transition">
                                <div class="space-y-1">
                                    <div class="flex items-center space-x-2">
                                        <span class="text-[10px] code-font text-cyan-400 uppercase px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/20">${p.category}</span>
                                        <span class="text-[10px] text-gray-500 code-font">${p.date || 'N/A'}</span>
                                    </div>
                                    <h4 class="font-bold text-white text-base">${p.title}</h4>
                                    <p class="text-xs text-gray-400 leading-relaxed">${p.description}</p>
                                    <span class="text-[10px] code-font text-gray-500 block pt-1">Stack: ${p.techStack}</span>
                                </div>
                                <button onclick="deleteProject('${p.id}')" class="p-2.5 rounded-xl bg-red-500/10 text-red-400 hover:bg-red-500/20 transition flex-shrink-0">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        `;
                    });
                    lucide.createIcons();
                }
            } catch (err) {
                console.error(err);
                statusBadge.className = "text-xs code-font px-3 py-1 rounded-full bg-red-500/10 text-red-400 border border-red-500/20";
                statusBadge.textContent = "Backend Offline";
                list.innerHTML = `<p class="text-red-400 text-xs text-center py-6">Failed to connect to backend server.</p>`;
            }
        }

        // Owner Profile Form Handler
        document.getElementById('ownerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('ownerName').value;
            const photoUrl = document.getElementById('ownerPhotoUrl').value;
            const msg = document.getElementById('ownerMsg');

            // LocalStorage me save kar liya taaki website ise fetch kar sake
            localStorage.setItem('deepkewa_owner_name', name);
            localStorage.setItem('deepkewa_owner_photo', photoUrl);

            msg.classList.remove('hidden');
            msg.className = "text-xs text-center text-cyan-400 mt-2";
            msg.textContent = "Owner profile updated successfully!";
            setTimeout(() => msg.classList.add('hidden'), 3000);
        });

        // Project Form Handler
        document.getElementById('projectForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('title').value;
            const category = document.getElementById('category').value;
            const techStack = document.getElementById('techStack').value;
            const description = document.getElementById('description').value;
            const msg = document.getElementById('uploadMsg');
            const submitBtn = document.getElementById('submitBtn');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';

            try {
                const res = await fetch(`${BACKEND_URL}/api/projects`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, category, techStack, description })
                });
                const data = await res.json();

                msg.classList.remove('hidden');
                if (data.success) {
                    msg.className = "text-xs text-center text-cyan-400 mt-2";
                    msg.textContent = "Project uploaded successfully!";
                    document.getElementById('projectForm').reset();
                    loadAdminData();
                } else {
                    msg.className = "text-xs text-center text-red-400 mt-2";
                    msg.textContent = data.error || 'Failed to upload.';
                }
            } catch (err) {
                msg.classList.remove('hidden');
                msg.className = "text-xs text-center text-red-400 mt-2";
                msg.textContent = 'Backend connection error.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Deploy / Upload Project';
            }
        });

        // Delete Project
        async function deleteProject(id) {
            if (confirm('Are you sure you want to delete this project?')) {
                try {
                    await fetch(`${BACKEND_URL}/api/projects/${id}`, { method: 'DELETE' });
                    loadAdminData();
                } catch (err) {
                    alert('Delete failed.');
                }
            }
        }

        // Preload saved owner profile info if exists
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('deepkewa_owner_name');
            const savedPhoto = localStorage.getItem('deepkewa_owner_photo');
            if(savedName) document.getElementById('ownerName').value = savedName;
            if(savedPhoto) document.getElementById('ownerPhotoUrl').value = savedPhoto;
            loadAdminData();
        });
    </script>
</body>
</html>
